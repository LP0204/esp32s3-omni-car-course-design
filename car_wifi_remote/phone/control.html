<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>小车遥控</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:-apple-system,'PingFang SC',sans-serif;background:linear-gradient(160deg,#eaf6ff,#f6fbff);color:#1d2a3a;user-select:none;}
.card{background:#fff;border-radius:18px;box-shadow:0 6px 18px rgba(31,88,146,.10);padding:12px;margin:10px auto;max-width:430px;}
.top{display:flex;align-items:center;justify-content:space-between;}
h1{font-size:18px;margin:0;color:#155e9e;}
#status{font-size:12px;color:#4a90c2;}
#cam{width:100%;border-radius:12px;background:#0b1520;transform:rotate(180deg);min-height:140px;object-fit:contain;display:block;}
.spdRow{display:flex;align-items:center;gap:10px;margin-top:10px;}
#spd{flex:1;accent-color:#155e9e;}
#spdLabel{font-size:14px;color:#155e9e;min-width:50px;text-align:right;font-weight:600;}
.switch{display:flex;background:#e3f0fa;border-radius:12px;padding:3px;margin-top:10px;}
.switch button{flex:1;border:none;background:transparent;color:#34688f;padding:8px 0;border-radius:10px;font-size:14px;}
.switch button.on{background:#fff;color:#155e9e;box-shadow:0 2px 6px rgba(31,88,146,.15);font-weight:600;}
.pianoGo{width:100%;margin-top:8px;border:none;border-radius:12px;padding:10px 0;color:#fff;font-size:14px;background:linear-gradient(180deg,#ffd479,#f0a93c);box-shadow:0 3px 0 rgba(20,50,80,.15);}
.pad{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto auto;gap:8px;margin-top:10px;}
.btn{border:none;border-radius:12px;color:#fff;touch-action:none;cursor:pointer;box-shadow:0 3px 0 rgba(20,50,80,.18);}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(20,50,80,.18);}
.rotL{grid-area:1/1;}.fwd{grid-area:1/2;}.rotR{grid-area:1/3;}
.strL{grid-area:2/1;}.bck{grid-area:2/2;}.strR{grid-area:2/3;}
.bA{background:linear-gradient(180deg,#4ecdc4,#2e9e97);padding:14px 0;font-size:15px;}
.bB{background:linear-gradient(180deg,#ff9f6e,#f07c3e);padding:14px 0;font-size:15px;}
.bStop{background:linear-gradient(180deg,#ff8f8f,#e85d5d);padding:14px 0;font-size:15px;}
.s1{background:linear-gradient(180deg,#7ec8ff,#4a9fe8);padding:14px 0;font-size:14px;}
.s2{background:linear-gradient(180deg,#5cb8ff,#3a8fd6);padding:14px 0;font-size:14px;}
.joyWrap{position:relative;width:230px;height:230px;margin:16px auto;background:#e9f3fb;border:2px solid #bfdcef;border-radius:50%;touch-action:none;}
.knob{position:absolute;left:50%;top:50%;width:74px;height:74px;margin:-37px 0 0 -37px;background:radial-gradient(circle at 35% 30%,#7ec8ff,#2f7ec2);border-radius:50%;box-shadow:0 4px 12px rgba(21,94,158,.35);}
.tip{font-size:11px;color:#7d96ab;text-align:center;line-height:1.6;margin-top:6px;}
h2{font-size:13px;color:#3c7aa6;margin:10px 0 4px;text-align:left;}
.sv{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto auto;gap:6px;}
.sUp{grid-area:1/2;}.sLv{grid-area:2/1;}.sReset{grid-area:2/2;}.sRv{grid-area:2/3;}.sDn{grid-area:3/2;}
.sv .btn{background:linear-gradient(180deg,#b7a6f6,#9378dd);padding:12px 0;font-size:14px;}
.sv .r{background:linear-gradient(180deg,#9ad2c8,#6fb8aa);}
.hide{display:none;}
</style>
</head>
<body>
<div class="card">
<div class="top"><h1>小车遥控</h1><div id="status">连接中…</div></div>
<img id="cam" src="http://192.168.4.1:81/stream" alt="画面加载中…">
<div class="spdRow">
<span style="font-size:13px;color:#7d96ab;">速度</span>
<input type="range" id="spd" min="0" max="2" step="1" value="1">
<span id="spdLabel">高速</span>
</div>
<div class="switch">
<button id="modeBtn" class="on">按钮控制</button>
<button id="modeJoy">摇杆控制</button>
</div>
<button class="pianoGo" onclick="goPiano()">🎹 钢琴</button>
</div>
<div class="card">
<div id="panelBtn">
<div class="pad">
<button class="btn s2 rotL" id="rotL">左转</button>
<button class="btn bA fwd" id="fwd">▲ 前进</button>
<button class="btn s2 rotR" id="rotR">右转</button>
<button class="btn s1 strL" id="strL">← 左移</button>
<button class="btn bB bck" id="bck">▼ 后退</button>
<button class="btn s1 strR" id="strR">右移 →</button>
</div>
</div>
<div id="panelJoy" class="hide">
<div class="joyWrap" id="joy"><div class="knob" id="knob"></div></div>
<div class="tip">按住拖动摇杆：上下=前进/后退，左右=转向，斜向自动混合；松手停止。</div>
</div>
<h2>云台控制</h2>
<div class="sv">
<button class="btn sUp" id="sUp">抬起</button>
<button class="btn r sLv" id="sL">左转</button>
<button class="btn sReset" id="sReset">复位</button>
<button class="btn r sRv" id="sR">右转</button>
<button class="btn sDn" id="sDn">低下</button>
</div>
<div class="tip">电脑键盘：W/S/A/D 前进/后退/左移/右移，Q/E 左转/右转；I/K/J/L 云台上下左右，R 复位。1.5 秒无指令自动停车。</div>
</div>
<script>
function send(u){fetch(u,{cache:'no-store'}).catch(function(){});}
function goPiano(){location.href='/piano';}
var spdLv=['med','high','ultra'],spdNm=['中速','高速','超高速'];
var spd=document.getElementById('spd'),spdLb=document.getElementById('spdLabel');
function onSpd(){var i=parseInt(spd.value,10);spdLb.textContent=spdNm[i];send('/speed?level='+spdLv[i]);}
spd.addEventListener('input',onSpd);
spd.addEventListener('change',onSpd);
function bindHold(id,act){
  var el=document.getElementById(id),timer=null;
  function start(e){e.preventDefault();send('/cmd?act='+act);timer=setInterval(function(){send('/cmd?act='+act);},120);}
  function end(){if(timer){clearInterval(timer);timer=null;}send('/cmd?act=stop');}
  el.addEventListener('touchstart',start,{passive:false});
  el.addEventListener('touchend',end);
  el.addEventListener('touchcancel',end);
  el.addEventListener('mousedown',start);
  el.addEventListener('mouseup',end);
  el.addEventListener('mouseleave',end);
}
bindHold('fwd','forward');
bindHold('bck','back');
bindHold('rotL','left');
bindHold('rotR','right');
bindHold('strL','strleft');
bindHold('strR','strright');
function bindServo(id,act,hold){
  var el=document.getElementById(id),timer=null;
  function start(e){e.preventDefault();send('/servo?act='+act);if(hold)timer=setInterval(function(){send('/servo?act='+act);},150);}
  function end(){if(timer){clearInterval(timer);timer=null;}}
  el.addEventListener('touchstart',start,{passive:false});
  el.addEventListener('touchend',end);
  el.addEventListener('touchcancel',end);
  if(hold){el.addEventListener('mousedown',start);el.addEventListener('mouseup',end);el.addEventListener('mouseleave',end);}
}
bindServo('sUp','up',true);
bindServo('sDn','down',true);
bindServo('sL','left',true);
bindServo('sR','right',true);
document.getElementById('sReset').onclick=function(){send('/servo?act=reset');};
var keyActs={'w':['cmd','forward'],'s':['cmd','back'],'a':['cmd','strleft'],'d':['cmd','strright'],'q':['cmd','left'],'e':['cmd','right'],'i':['servo','up'],'k':['servo','down'],'j':['servo','left'],'l':['servo','right'],'r':['servo','reset']};
var keyTimers={};
window.addEventListener('keydown',function(e){var k=e.key.toLowerCase();if(!keyActs[k]||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;e.preventDefault();var p=keyActs[k];send('/'+p[0]+'?act='+p[1]);if(p[1]!=='reset'){if(keyTimers[k])clearInterval(keyTimers[k]);keyTimers[k]=setInterval(function(){send('/'+p[0]+'?act='+p[1]);},100);}});
window.addEventListener('keyup',function(e){var k=e.key.toLowerCase();if(!keyActs[k])return;if(keyTimers[k]){clearInterval(keyTimers[k]);delete keyTimers[k];}if(keyActs[k][0]==='cmd')send('/cmd?act=stop');});
function setMode(m){
  var btn=m==='btn';
  document.getElementById('panelBtn').classList.toggle('hide',!btn);
  document.getElementById('panelJoy').classList.toggle('hide',btn);
  document.getElementById('modeBtn').classList.toggle('on',btn);
  document.getElementById('modeJoy').classList.toggle('on',!btn);
}
document.getElementById('modeBtn').onclick=function(){setMode('btn');};
document.getElementById('modeJoy').onclick=function(){setMode('joy');};
var joy=document.getElementById('joy'),knob=document.getElementById('knob'),joyOn=false;
function joyPos(e){
  var r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  var dx=(e.touches?e.touches[0].clientX:e.clientX)-cx;
  var dy=(e.touches?e.touches[0].clientY:e.clientY)-cy;
  var max=r.width/2-8,dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>max){dx=dx/dist*max;dy=dy/dist*max;}
  knob.style.left=(50+dx/max*50)+'%';
  knob.style.top=(50+dy/max*50)+'%';
  var x=Math.round(dx/max*100),y=Math.round(-dy/max*100);
  send('/joy?x='+x+'&y='+y);
}
function joyEnd(){joyOn=false;knob.style.left='50%';knob.style.top='50%';send('/cmd?act=stop');}
joy.addEventListener('touchstart',function(e){e.preventDefault();joyOn=true;joyPos(e);},{passive:false});
joy.addEventListener('touchmove',function(e){e.preventDefault();if(joyOn)joyPos(e);},{passive:false});
joy.addEventListener('touchend',joyEnd);
joy.addEventListener('touchcancel',joyEnd);
joy.addEventListener('mousedown',function(e){joyOn=true;joyPos(e);});
document.addEventListener('mousemove',function(e){if(joyOn)joyPos(e);});
document.addEventListener('mouseup',joyEnd);
setInterval(function(){
  fetch('/ping',{cache:'no-store'}).then(function(){document.getElementById('status').textContent='已连接 192.168.4.1';})
  .catch(function(){document.getElementById('status').textContent='连接断开';});
},1000);
</script>
</body>
</html>
